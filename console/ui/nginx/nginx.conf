worker_processes auto;

events {
  worker_connections 8000;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;

  # DBDesk responses must be uncompressed upstream so sub_filter can rewrite
  # them. Compress the rewritten response before sending it to the browser.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 5;
  gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml;

  # Reuse successful DBDesk authorization checks across the burst of static
  # asset requests made while the editor is starting.
  proxy_cache_path /var/cache/nginx/dbdesk-auth levels=1:2 keys_zone=dbdesk_auth:1m max_size=10m inactive=10m use_temp_path=off;

  map $uri $dbdesk_expires {
    default                    epoch;
    ~^/dbdesk/assets/          1d;
    ~^/dbdesk/favicon\.ico$    1d;
  }

  server {
    listen 80;
    access_log /var/log/nginx/access.log;

    # Edge-managed CORS (works for UI and proxied API)
    add_header Access-Control-Allow-Origin $http_origin always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS, PATCH, DELETE, PUT" always;
    add_header Access-Control-Allow-Headers "Authorization, Access-Control-Allow-Origin, Access-Control-Allow-Headers, Origin,Accept, X-Requested-With, Content-Type, Access-Control-Request-Method, Access-Control-Request-Headers, X-Auth-Token" always;
    add_header Access-Control-Expose-Headers "X-Log-Completed, X-Cluster-Id" always;

    # SPA root
    root  /usr/share/nginx/html;
    index index.html index.htm;

    # API proxy
    location /api/ {
      # Preflight fast-path
      if ($request_method = OPTIONS) {
        add_header Access-Control-Max-Age 86400 always;
        return 204;
      }

      resolver 127.0.0.11 ipv6=off;

      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection        "";
      proxy_set_header X-CORS            by-nginx;  # marker for backend

      # <<< placeholders; will be replaced by env.sh >>>
      proxy_pass http://REPLACE_ME_WITH_API_HOST:REPLACE_ME_WITH_API_PORT;
    }

    # SPA routing
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
      expires off;
      etag off;
      if_modified_since off;
    }

    # Static assets: 1 day cache (no immutable unless filenames are hashed)
    location ~* \.(?:css|js)$ {
      try_files $uri =404;
      access_log off;
      expires 1d;
      add_header Cache-Control "public, max-age=86400";
    }

    # Auth gate for the embedded SQL editor. dbdesk-studio is a separate app
    # served under /dbdesk/ and cannot send the console's Authorization header
    # (page navigation + its own XHR), so the UI mirrors the console token into
    # the `autobase_dbdesk` cookie (Path=/dbdesk/) and nginx validates it against
    # the API with the same check /api/ enforces. Without this, /dbdesk/api/*
    # (including stored cluster credentials) was reachable with no auth at all.
    location = /_dbdesk_auth {
      internal;
      resolver 127.0.0.11 ipv6=off;

      proxy_http_version 1.1;
      proxy_pass_request_body off;
      proxy_set_header Content-Length "";
      proxy_set_header Connection     "";
      proxy_set_header Authorization  "Bearer $cookie_autobase_dbdesk";

      proxy_cache dbdesk_auth;
      proxy_cache_key $cookie_autobase_dbdesk;
      proxy_cache_valid 200 10m;
      proxy_cache_valid 401 1s;
      proxy_cache_lock on;

      proxy_pass http://REPLACE_ME_WITH_API_HOST:REPLACE_ME_WITH_API_PORT/api/v1/version;
    }

    # dbdesk-studio reverse proxy (same-origin access under /dbdesk/ path)
    location ^~ /dbdesk/ {
      auth_request /_dbdesk_auth;

      resolver 127.0.0.11 ipv6=off;

      proxy_pass http://REPLACE_ME_WITH_DBDESK_HOST:REPLACE_ME_WITH_DBDESK_LISTEN_PORT/;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade           $http_upgrade;
      proxy_set_header Connection        "upgrade";
      proxy_set_header Cookie            "";

      # DBDesk ships hashed assets but does not provide useful browser caching.
      # Keep API and HTML responses uncached while caching static assets.
      expires $dbdesk_expires;

      # Prevent upstream from compressing so sub_filter can inspect the body
      proxy_set_header Accept-Encoding "";

      # Rewrite absolute asset paths so they resolve under /dbdesk/
      sub_filter_once off;
      sub_filter_types text/html application/javascript text/javascript;
      sub_filter 'href="/assets/' 'href="/dbdesk/assets/';
      sub_filter 'src="/assets/'  'src="/dbdesk/assets/';
      sub_filter 'href="/favicon.ico"' 'href="/dbdesk/favicon.ico"';

      # Set base path so TanStack Router and API client resolve under /dbdesk/
      sub_filter '__DBDESK_BASE_PATH__=""' '__DBDESK_BASE_PATH__="/dbdesk"';

      # Rewrite hardcoded Express backend URL to route through the /dbdesk/ proxy
      sub_filter 'http://localhost:6789' '/dbdesk';
    }

    # Other files with extension must exist
    location ~ ^.+\..+$ {
      try_files $uri =404;
    }
  }

  # dbdesk-studio (SQL editor)
  server {
    listen REPLACE_ME_WITH_DBDESK_LISTEN_PORT;
    root /usr/share/nginx/dbdesk;
    index index.html;

    # Proxy API requests to the Express backend
    location /api/ {
      proxy_pass http://127.0.0.1:REPLACE_ME_WITH_DBDESK_EXPRESS_PORT;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }

    # Health check endpoint (forwarded to Express)
    location /health {
      proxy_pass http://127.0.0.1:REPLACE_ME_WITH_DBDESK_EXPRESS_PORT;
    }

    # SPA routing
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
