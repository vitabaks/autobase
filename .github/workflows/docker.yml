---
name: "Docker"

on:
  push:
    branches:
      - master
    tags:
      - "*"
  pull_request:
    branches:
      - master
  workflow_dispatch:
    inputs:
      run_arm64:
        description: "Run arm64 Docker build validation"
        type: boolean
        required: false
        default: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Run arm64 only on master/tag pushes, or when manually requested in workflow_dispatch.
      RUN_ARM64: ${{ (github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_arm64 == 'true') }}

    steps:
      - name: Set TERM environment variable
        run: echo "TERM=xterm" >> $GITHUB_ENV

      - name: Extract branch or tag name
        run: |
          if [[ -n "${GITHUB_HEAD_REF}" ]]; then
            # This is a PR, use the source branch name
            echo "REF_NAME=${GITHUB_HEAD_REF}" >> $GITHUB_ENV
          else
            # This is a push, use the branch or tag name from GITHUB_REF
            echo "REF_NAME=${GITHUB_REF##*/}" >> $GITHUB_ENV
          fi

      - name: Set TAG
        run: |
          if [[ "${{ env.REF_NAME }}" == "master" ]]; then
            echo "TAG=latest" >> $GITHUB_ENV
          else
            echo "TAG=${{ env.REF_NAME }}" >> $GITHUB_ENV
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        if: ${{ env.RUN_ARM64 == 'true' }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: make bootstrap-dev

      - name: Run Docker lint
        run: make docker-lint

      - name: Run Docker build (amd64)
        run: make docker-build
        env:
          TAG: ${{ env.TAG }}
          DOCKER_BUILD_PLATFORM: linux/amd64

      - name: Run Docker build (arm64)
        if: ${{ env.RUN_ARM64 == 'true' }}
        run: make docker-build
        env:
          TAG: ${{ env.TAG }}
          DOCKER_BUILD_PLATFORM: linux/arm64

      # push latest image
      - name: Run Docker push
        if: ${{ env.DOCKER_REGISTRY_USER != '' && env.DOCKER_REGISTRY_PASSWORD != '' && github.event_name != 'pull_request' }}
        run: make docker-push
        env:
          TAG: ${{ env.TAG }}
          DOCKER_REGISTRY_USER: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_REGISTRY_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
